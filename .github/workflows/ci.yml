name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"

# Third-party actions are pinned by commit SHA (the tag is in the comment); updates are reviewed by hand.
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Repository hygiene (secrets, personal data, forbidden patterns)
        env:
          SW_FORBIDDEN_PATTERNS: ${{ secrets.SW_FORBIDDEN_PATTERNS }}
        run: python3 scripts/check-hygiene.py
      - name: DCO sign-off
        if: github.event_name == 'pull_request'
        run: bash scripts/check-dco.sh "origin/${{ github.base_ref }}" "${{ github.sha }}"

  build:
    runs-on: ubuntu-latest
    # Real Postgres and Valkey for the readiness integration tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sw
          POSTGRES_PASSWORD: swellwright-ci
          POSTGRES_DB: swellwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sw -d swellwright" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SW_DATABASE_URL: postgresql://sw:swellwright-ci@127.0.0.1:5432/swellwright
      SW_TEST_DATABASE_URL: postgresql://sw:swellwright-ci@127.0.0.1:5432/swellwright
      SW_TEST_VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from the "packageManager" field of package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile, no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format
        run: pnpm run format
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      # The migration runner checks the Prisma schema engine against the pinned checksum first (ADR 0013).
      - name: Apply database migrations
        run: pnpm run db:migrate:deploy
      - name: Database schema matches the migrations
        run: pnpm run db:schema:check
      - name: Test
        run: pnpm run test
      - name: API description is up to date
        run: pnpm run openapi:check

  # The SSH layer against a real sshd (ADR 0035): a small Ubuntu image with key logins only, a throwaway key and a
  # throwaway sudo password made in this job. The same suites run in the build job against the in-process server;
  # these add the real thing (exec, sudo over stdin, SFTP, detached steps that survive a cut connection).
  sshd:
    runs-on: ubuntu-latest
    env:
      SW_TEST_SSH_HOST: "127.0.0.1"
      SW_TEST_SSH_PORT: "2222"
      SW_TEST_SSH_USER: swtest
      SW_TEST_SSH_BASE_DIR: /var/lib/swellwright-test/steps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile, no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the SSH package
        run: pnpm exec turbo run build --filter=@swellwright/ssh
      - name: Throwaway key and sudo password
        run: |
          ssh-keygen -q -t ed25519 -N "" -C swellwright-ci-throwaway -f "$RUNNER_TEMP/swtest_key"
          sudo_password="$(openssl rand -hex 12)"
          echo "::add-mask::${sudo_password}"
          echo "SW_TEST_SSH_SUDO_PASSWORD=${sudo_password}" >> "$GITHUB_ENV"
          echo "SW_TEST_SSH_KEY=$RUNNER_TEMP/swtest_key" >> "$GITHUB_ENV"
      - name: Build and start the test sshd
        run: |
          docker build -t swellwright-test-sshd packages/ssh/test/sshd
          # --init: a process that outlives its parent must be reaped by an init, as on a real server.
          docker run -d --init --name swtest-sshd -p 127.0.0.1:2222:22 \
            -e SWTEST_PUBLIC_KEY="$(cat "$RUNNER_TEMP/swtest_key.pub")" \
            -e SWTEST_SUDO_PASSWORD="$SW_TEST_SSH_SUDO_PASSWORD" \
            swellwright-test-sshd
          for attempt in $(seq 1 30); do
            if ssh-keyscan -p 2222 127.0.0.1 2>/dev/null | grep -q ssh-ed25519; then exit 0; fi
            sleep 1
          done
          docker logs swtest-sshd
          echo "the test sshd did not come up"
          exit 1
      - name: Tests against the real sshd
        working-directory: packages/ssh
        run: node --test --test-reporter=spec "dist/**/*.integration.test.js"
      - name: sshd log
        if: failure()
        run: docker logs --tail 200 swtest-sshd
      - name: Stop the test sshd
        if: always()
        run: docker rm -f swtest-sshd

  # The dependencies a pull request adds or changes: fails on a known vulnerability of high severity. What is already
  # in the lockfile is covered by the Dependabot alerts.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # What a pull request does to the API description, compared with main (ADR 0012). A report, not a gate: until the first
  # release the API may change, and the report says what a client would notice. oasdiff is the release binary, pinned by
  # version and SHA-256 (no third-party action, nothing is uploaded).
  api-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: "1.38.0"
      OASDIFF_SHA256: "613037fd6a1d3362a1b742d6d86c338c0eb5ab3511f4942ce3948e78720ea2da"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install oasdiff (pinned checksum)
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${archive}"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/oasdiff"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oasdiff" oasdiff
      - name: Compare the API description with main
        run: |
          base="$RUNNER_TEMP/openapi-base.json"
          if ! git show "origin/${{ github.base_ref }}:docs/api/openapi.json" > "$base" 2>/dev/null; then
            echo "main has no API description yet: nothing to compare." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          oasdiff="$RUNNER_TEMP/oasdiff/oasdiff"
          {
            echo "## API changes compared with ${{ github.base_ref }}"
            echo
            echo "### Breaking"
            echo '```'
            "$oasdiff" breaking "$base" docs/api/openapi.json || true
            echo '```'
            echo
            echo "### Changelog"
            echo '```'
            "$oasdiff" changelog "$base" docs/api/openapi.json || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The node installer artifact (ADR 0036): the manifest and the README tables are what the script says, the script parses under
  # sh and dash, shellcheck has no error to report, and every step runs in a temporary root with stubbed commands (a real
  # HAProxy checks the configuration the haproxy step writes).
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Manifest and README tables are up to date
        run: node scripts/artifact-manifest.mjs --check
      - name: Tools (dash, shellcheck, HAProxy)
        run: |
          # The packages must not start services on the runner (HAProxy is only needed to check a configuration file).
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dash shellcheck haproxy
      - name: Syntax under sh and dash
        run: |
          sh -n artifacts/node-installer/install.sh
          dash -n artifacts/node-installer/install.sh
      - name: shellcheck (warnings and errors in the installer, errors in the test scripts)
        run: |
          shellcheck -s sh -S warning artifacts/node-installer/install.sh
          shellcheck -s sh -S error artifacts/node-installer/test/*.sh
      - name: shellcheck notes (not a gate)
        run: shellcheck -s sh -S style artifacts/node-installer/install.sh artifacts/node-installer/test/*.sh || true
      - name: Test suite
        run: sh artifacts/node-installer/test/run-tests.sh

  # The container image and the compose stack of deploy/compose, started for real (ADR 0019).
  image:
    runs-on: ubuntu-latest
    env:
      # Every `docker compose` command below uses this file, and reads the .env next to it.
      COMPOSE_FILE: deploy/compose/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secrets for a throwaway stack
        run: |
          setup_token="$(openssl rand -hex 24)"
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "SW_AUTH_KEY=$(openssl rand -base64 32)"
            echo "SW_SETUP_TOKEN=${setup_token}"
            # curl does not send Secure cookies over plain HTTP to an address other than localhost.
            echo "SW_COOKIE_SECURE=false"
          } > deploy/compose/.env
          echo "$setup_token" > "$RUNNER_TEMP/setup-token"
      - name: Build the image and start the stack
        run: docker compose up -d --build
      - name: Smoke test
        run: bash scripts/smoke-test.sh http://127.0.0.1:3100 "$(cat "$RUNNER_TEMP/setup-token")"
      - name: The container is locked down and its tools work
        run: |
          test "$(docker compose exec -T swellwright id -u)" != 0
          if docker compose exec -T swellwright sh -c 'touch /app/probe' 2>/dev/null; then
            echo "the file system of the container is writable"
            exit 1
          fi
          docker compose exec -T swellwright node apps/api/dist/healthcheck.js
          docker compose exec -T swellwright node apps/api/dist/admin.js users | grep -q '^owner'
          # The built-in artifacts are in the image and every file is what its manifest says (ADR 0039).
          docker compose exec -T swellwright node apps/api/dist/admin.js artifacts | tee "$RUNNER_TEMP/artifacts.txt"
          grep -Eq '^node-installer +[0-9]+\.[0-9]+\.[0-9]+ +ok ' "$RUNNER_TEMP/artifacts.txt"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop and remove the stack
        if: always()
        run: docker compose down --volumes
