url(#card2)"/><text x="880" y="106" font-size="20" font-weight="700" fill="#eaf4ff">DNS providers</text><text x="880" y="130" font-size="14" fill="#93b4d6">records, propagation checks</text><rect x="860" y="226" width="220" height="68" rx="14" fill="#0d2240" stroke="#3bc9db" stroke-opacity=".6" stroke-width="2"/><rect x="860" y="226" width="8" height="68" fill="#3bc9db" clip-path="url(#card3)"/><text x="880" y="256" font-size="20" font-weight="700" fill="#eaf4ff">Certificates</text><text x="880" y="280" font-size="14" fill="#93b4d6">distribution and expiry</text><rect x="190" y="396" width="220" height="68" rx="14" fill="#0d2240" stroke="#3bc9db" stroke-opacity=".6" stroke-width="2"/><rect x="190" y="396" width="8" height="68" fill="#3bc9db" clip-path="url(#card4)"/><text x="210" y="426" font-size="20" font-weight="700" fill="#eaf4ff">Hosting APIs</text><text x="210" y="450" font-size="14" fill="#93b4d6">reinstall, power (plugins)</text><rect x="790" y="396" width="220" height="68" rx="14" fill="#0d2240" stroke="#3bc9db" stroke-opacity=".6" stroke-width="2"/><rect x="790" y="396" width="8" height="68" fill="#3bc9db" clip-path="url(#card5)"/><text x="810" y="426" font-size="20" font-weight="700" fill="#eaf4ff">Notifications</text><text x="810" y="450" font-size="14" fill="#93b4d6">Telegram, e-mail, webhooks</text><rect x="490" y="396" width="220" height="68" rx="14" fill="#0d2240" stroke="#3bc9db" stroke-opacity=".6" stroke-width="2"/><rect x="490" y="396" width="8" height="68" fill="#3bc9db" clip-path="url(#card6)"/><text x="510" y="426" font-size="20" font-weight="700" fill="#eaf4ff">Probes</text><text x="510" y="450" font-size="14" fill="#93b4d6">checks from other networks</text><rect class="hub" x="430" y="208" width="340" height="104" rx="22" fill="#10305a" stroke="url(#hubline)" stroke-width="3"/><svg x="448" y="226" width="68" height="68" viewBox="0 0 40 40"><polygon points="20,3 34.7,11.5 34.7,28.5 20,37 5.3,28.5 5.3,11.5" fill="none" stroke="#3bc9db" stroke-