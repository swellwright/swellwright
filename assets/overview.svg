<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">What Swellwright connects</title>
  <desc id="d">Swellwright orchestrates the Remnawave panel, servers and nodes over SSH, DNS providers, certificates, hosting APIs, notifications and probes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#0e2a4d"/></linearGradient>
    <linearGradient id="hubline" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3bc9db"/><stop offset="1" stop-color="#3bc9db"/></linearGradient>
    <clipPath id="card0"><rect x="120" y="76" width="220" height="68" rx="14"/></clipPath><clipPath id="card1"><rect x="120" y="226" width="220" height="68" rx="14"/></clipPath><clipPath id="card2"><rect x="860" y="76" width="220" height="68" rx="14"/></clipPath><clipPath id="card3"><rect x="860" y="226" width="220" height="68" rx="14"/></clipPath><clipPath id="card4"><rect x="190" y="396" width="220" height="68" rx="14"/></clipPath><clipPath id="card5"><rect x="790" y="396" width="220" height="68" rx="14"/></clipPath><clipPath id="card6"><rect x="490" y="396" width="220" height="68" rx="14"/></clipPath>
    <style>
      text{font-family:-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
      .flow{animation:dash 2.6s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-32}}
      .hub{animation:glow 4s ease-in-out infinite}
      @keyframes glow{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>
  <rect width="1200" height="520" rx="20" fill="url(#bg)"/>
