<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Swellwright</title>
  <desc id="d">Deploy and operate Remnawave fleets: plan, approve, apply, verify, roll back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#0e2a4d"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe9ff"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      text{font-family:-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
      .tag{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
      .flow{animation:dash 2.4s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-24}}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-out infinite;opacity:0}
      @keyframes pulse{0%{opacity:.8;transform:scale(1)}70%,100%{opacity:0;transform:scale(3)}}
      .w0{animation:sw0 14s linear infinite}@keyframes sw0{from{transform:translateX(0px)}to{transform:translateX(-400px)}}.w1{animation:sw1 10s linear infinite}@keyframes sw1{from{transform:translateX(-300px)}to{transform:translateX(0px)}}.w2{animation:sw2 18s linear infinite}@keyframes sw2{from{transform:translateX(0px)}to{transform:translateX(-600px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="1000" cy="40" r="260" fill="#3bc9db" fill-opacity=".10"/>
    <circle cx="140" cy="300" r="220" fill="#3bc9db" fill-opacity=".06"/>
    <line class="flow" x1="940" y1="57" x2="1040" y2="117" stroke="#3bc9db" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 8"/><line class="flow" x1="1040" y1="117" x2="1130" y2="49" stroke="#3bc9db" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 8"/><line class="flow" x1="1040" y1="117" x2="1000" y2="187" stroke="#3bc9db" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 8"/><line class="flow" x1="1000" y1="187" x2="1118" y2="175" stroke="#3bc9db" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 8"/><line class="flow" x1="1040" y1="117" x2="1118" y2="175" stroke="#3bc9db" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 8"/><line class="flow" x1="940" y1="57" x2="1000" y2="187" stroke="#3bc9db" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 8"/><circle cx="940" cy="57" r="6" fill="#3bc9db"/><circle class="pulse" style="animation-delay:0s" cx="940" cy="57" r="6" fill="none" stroke="#3bc9db" stroke-width="2"/><circle cx="1040" cy="117" r="9" fill="#ffffff"/><circle class="pulse" style="animation-delay:0.6s" cx="1040" cy="117" r="9" fill="none" stroke="#3bc9db" stroke-width="2"/><circle cx="1130" cy="49" r="6" fill="#3bc9db"/><circle class="pulse" style="animation-delay:1.2s" cx="1130" cy="49" r="6" fill="none" stroke="#3bc9db" stroke-width="2"/><circle cx="1000" cy="187" r="6" fill="#3bc9db"/><circle class="pulse" style="animation-delay:1.8s" cx="1000" cy="187" r="6" fill="none" stroke="#3bc9db" stroke-width="2"/><circle cx="1118" cy="175" r="6" fill="#3bc9db"/><circle class="pulse" style="animation-delay:2.4s" cx="1118" cy="175" r="6" fill="none" stroke="#3bc9db" stroke-width="2"/>
    <g transform="translate(42,48.5) scale(3.5)"><polygon points="20,3 34.7,11.5 34.7,28.5 20,37 5.3,28.5 5.3,11.5" fill="none" stroke="#3bc9db" stroke-width="2"/><path d="M11 17q4.5 -4 9 0t9 0" fill="none" stroke="#3bc9db" stroke-linecap="round" stroke-width="1.8"/><path d="M11 23.5q4.5 -4 9 0t9 0" fill="none" stroke="#3bc9db" stroke-linecap="round" stroke-width="1.8"/></g>
    <text x="214" y="103" font-size="76" font-weight="800" fill="url(#word)" letter-spacing="-1">Swellwright</text>
    <text x="216" y="151" font-size="27" fill="#eaf4ff">Deploy and operate Remnawave fleets</text>
    <text class="tag" x="217" y="189" font-size="17" fill="#3bc9db" letter-spacing="1.2">plan  ·  approve  ·  apply  ·  verify  ·  roll back</text>
    <path class="w0" d="M0,252 Q100,220 200,252 T400,252 T600,252 T800,252 T1000,252 T1200,252 T1400,252 T1600,252 T1800,252 T2000,252 L2000,320 L0,320 Z" fill="#3bc9db" fill-opacity="0.3"/><path class="w1" d="M0,270 Q75,242 150,270 T300,270 T450,270 T600,270 T750,270 T900,270 T1050,270 T1200,270 T1350,270 T1500,270 T1650,270 T1800,270 L1800,320 L0,320 Z" fill="#3bc9db" fill-opacity="0.4"/><path class="w2" d="M0,288 Q150,264 300,288 T600,288 T900,288 T1200,288 T1500,288 T1800,288 T2100,288 T2400,288 L2400,320 L0,320 Z" fill="#3bc9db" fill-opacity="0.55"/>
