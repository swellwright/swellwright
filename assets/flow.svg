<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="t d">
  <title id="t">Change workflow</title>
  <desc id="d">Every change goes through five stages: plan, approve, apply, verify and roll back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#0e2a4d"/></linearGradient>
    <style>
      text{font-family:-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
      .flow{animation:dash 2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
      .act{opacity:0;animation:act 8s ease-in-out infinite}
      @keyframes act{0%{opacity:0}4%{opacity:1}14%{opacity:1}22%,100%{opacity:0}}
      .dot{animation:travel 8s linear infinite}
      @keyframes travel{0%{transform:translateX(0);opacity:1}80%{transform:translateX(920px);opacity:1}90%,100%{transform:translateX(920px);opacity:0}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>
  <rect width="1200" height="250" rx="20" fill="url(#bg)"/>
  <line x1="140" y1="34" x2="1060" y2="34" stroke="#93b4d6" stroke-opacity=".3" stroke-width="2"/><line x1="140" y1="34" x2="140" y2="62" stroke="#93b4d6" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 5"/><line x1="370" y1="34" x2="370" y2="62" stroke="#93b4d6" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 5"/><line x1="600" y1="34" x2="600" y2="62" stroke="#93b4d6" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 5"/><line x1="830" y1="34" x2="830" y2="62" stroke="#93b4d6" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 5"/><line x1="1060" y1="34" x2="1060" y2="62" stroke="#93b4d6" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 5"/><line x1="232" y1="96" x2="278" y2="96" stroke="#93b4d6" stroke-opacity=".35" stroke-width="3"/><line class="flow" x1="232" y1="96" x2="278" y2="96" stroke="#3bc9db" stroke-opacity=".9" stroke-width="3" stroke-dasharray="6 8"/><line x1="462" y1="96" x2="508" y2="96" stroke="#93b4d6" stroke-opacity=".35" stroke-width="3"/><line class="flow" x1="462" y1="96" x2="508" y2="96" stroke="#3bc9db" stroke-opacity=".9" stroke-width="3" stroke-dasharray="6 8"/><line x1="692" y1="96" x2="738" y2="96" stroke="#93b4d6" stroke-opacity=".35" stroke-width="3"/><line class="flow" x1="692" y1="96" x2="738" y2="96" stroke="#3bc9db" stroke-opacity=".9" stroke-width="3" stroke-dasharray="6 8"/><line x1="922" y1="96" x2="968" y2="96" stroke="#93b4d6" stroke-opacity=".35" stroke-width="3"/><line class="flow" x1="922" y1="96" x2="968" y2="96" stroke="#3bc9db" stroke-opacity=".9" stroke-width="3" stroke-dasharray="6 8"/><rect x="48" y="62" width="184" height="68" rx="16" fill="#0d2240" stroke="#3bc9db" stroke-opacity=".55" stroke-width="2"/><rect class="act" style="animation-delay:0s" x="48" y="62" width="184" height="68" rx="16" fill="#3bc9db" fill-opacity=".28" stroke="#3bc9db" stroke-width="2"/><text x="140" y="106" text-anchor="middle"><tspan font-size="30" font-weight="700" fill="#3bc9db">1</tspan><tspan dx="12" font-size="26" font-weight="600" fill="#eaf4ff">Plan</tspan></text><text x="140" y="166" text-anchor="middle" font-size="16" fill="#93b4d6">impact, diff,</text><text x="140" y="188" text-anchor="middle" font-size="16" fill="#93b4d6">pre-change snapshot</text><rect x="278" y="62" width="184" height="68" rx="16" fill="#0d2240" stroke="#3bc9db" stroke-opacity=".55" stroke-width="2"/><rect class="act" style="animation-delay:1.6s" x="278" y="62" width="184" height="68" rx="16" fill="#3bc9db" fill-opacity=".28" stroke="#3bc9db" stroke-width="2"/><text x="370" y="106" text-anchor="middle"><tspan font-size="30" font-weight="700" fill="#3bc9db">2</tspan><tspan dx="12" font-size="26" font-weight="600" fill="#eaf4ff">Approve</tspan></text><text x="370" y="166" text-anchor="middle" font-size="16" fill="#93b4d6">human gate bound</text><text x="370" y="188" text-anchor="middle" font-size="16" fill="#93b4d6">to a hash of the plan</text><rect x="508" y="62" width="184" height="68" rx="16" fill="#0d2240" stroke="#3bc9db" stroke-opacity=".55" stroke-width="2"/><rect class="act" style="animation-delay:3.2s" x="508" y="62" width="184" height="68" rx="16" fill="#3bc9db" fill-opacity=".28" stroke="#3bc9db" stroke-width="2"/><text x="600" y="106" text-anchor="middle"><tspan font-size="30" font-weight="700" fill="#3bc9db">3</tspan><tspan dx="12" font-size="26" font-weight="600" fill="#eaf4ff">Apply</tspan></text><text x="600" y="166" text-anchor="middle" font-size="16" fill="#93b4d6">detached steps,</text><text x="600" y="188" text-anchor="middle" font-size="16" fill="#93b4d6">journal, live progress</text><rect x="738" y="62" width="184" height="68" rx="16" fill="#0d2240" stroke="#3bc9db" stroke-opacity=".55" stroke-width="2"/><rect class="act" style="animation-delay:4.8s" x="738" y="62" width="184" height="68" rx="16" fill="#3bc9db" fill-opacity=".28" stroke="#3bc9db" stroke-width="2"/><text x="830" y="106" text-anchor="middle"><tspan font-size="30" font-weight="700" fill="#3bc9db">4</tspan><tspan dx="12" font-size="26" font-weight="600" fill="#eaf4ff">Verify</tspan></text><text x="830" y="166" text-anchor="middle" font-size="16" fill="#93b4d6">checks and probes</text><text x="830" y="188" text-anchor="middle" font-size="16" fill="#93b4d6">after every stage</text><rect x="968" y="62" width="184" height="68" rx="16" fill="#0d2240" stroke="#3bc9db" stroke-opacity=".55" stroke-width="2"/><rect class="act" style="animation-delay:6.4s" x="968" y="62" width="184" height="68" rx="16" fill="#3bc9db" fill-opacity=".28" stroke="#3bc9db" stroke-width="2"/><text x="1060" y="106" text-anchor="middle"><tspan font-size="30" font-weight="700" fill="#3bc9db">5</tspan><tspan dx="12" font-size="26" font-weight="600" fill="#eaf4ff">Roll back</tspan></text><text x="1060" y="166" text-anchor="middle" font-size="16" fill="#93b4d6">undo records,</text><text x="1060" y="188" text-anchor="middle" font-size="16" fill="#93b4d6">whole run or one stage</text><g class="dot"><circle cx="140" cy="34" r="8" fill="#ffffff"/><circle cx="140" cy="34" r="16" fill="#3bc9db" fill-opacity=".35"/></g>
</svg>
