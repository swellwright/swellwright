packages:
  - apps/*
  - packages/*

# Supply-chain hardening (ADR 0009): never run dependency lifecycle scripts, and do not
# install a version published less than three days ago (value is in minutes).
onlyBuiltDependencies: []
minimumReleaseAge: 4320

# ssh2 lists two optional native add-ons (cpu-features and nan, built by install scripts). They are never installed:
# the SSH layer runs in the pure-JavaScript mode of ssh2 (ADR 0035).
ignoredOptionalDependencies:
  - cpu-features
  - nan

# GHSA-7589-6fvf-x4pw (effect < 3.22.1). Prisma's config loader (@prisma/config 7.10.1) pins effect 3.20.0 exactly,
# and a newer 7.x with a newer effect needs the engine checksums pinned again (packages/db/README.md). The override
# takes the newest 3.22 release that is old enough for the wait above (the fix is in 3.22.1); drop it when Prisma is upgraded.
overrides:
  "@prisma/config>effect": 3.22.4
  # monaco-editor 0.56.0 pins dompurify 3.4.8 exactly, which has eight advisories (the newest, 3.4.18, fixes all of them;
  # ADR 0038). The patch release is API-compatible; drop the override when a monaco-editor that depends on a fixed
  # version is used.
  dompurify: 3.4.18
  # GHSA-mrhx-c7xc-m3w5 (zod < 4.6.6, memory exhaustion on oversized constrained collections). The panel's contract package, a
  # development dependency that only the tests of packages/remnawave load, pins zod 4.4.3 exactly; its schemas use the Zod 4 API
  # that 4.6.7 keeps, and the tests that feed them the fixtures of the fake panel pass with it (ADR 0041).
  "@remnawave/backend-contract>zod": 4.6.7
